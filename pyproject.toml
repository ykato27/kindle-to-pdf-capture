[project]
name = "kindle-capture"
version = "0.1.0"
description = "Capture Kindle pages as screenshots and combine them into a PDF"
authors = [{name = "Kindle Capture"}]
requires-python = ">=3.10"
dependencies = [
    "pyautogui",
    "pillow",
    "pynput>=1.8.2",
]

[project.scripts]
kindle-capture = "kindle_capture.cli:main"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
